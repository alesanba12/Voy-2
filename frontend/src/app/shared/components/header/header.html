<header class="main-header">

    <div class="header-left">
        <a routerLink="/parties/catalogo" class="logo">
            Voy<span class="logo-dot"></span>
        </a>
        <nav class="main-nav">
            <a routerLink="/parties/catalogo" routerLinkActive="active" class="nav-link">
                Explorar
            </a>
            @if (isAuthenticated()) {
            <a routerLink="/actividad" routerLinkActive="active" class="nav-link">
                Mi actividad
            </a>
            }
        </nav>
    </div>

    <div class="header-right">
        @if(this.isAuthenticated()){
            <div class="user-menu-container">
            <button class="user-avatar-btn" (click)="toggleUserMenu()" aria-label="Abrir menú de usuario">
                @if (userProfile()?.imageUrl; as imageUrl) {
                <img [src]="imageUrl" alt="Foto de perfil">
                }@else {
                    <img [src]="defaulImage" alt="Foto de perfil">
                }
            </button>
            @if (isMenuOpen()) {
            <div class="dropdown-menu" (click)="closeUserMenu()">
                <a routerLink="/profile" class="dropdown-item">Mi Perfil</a>
                @if (isAdmin()) {
                <a routerLink="/admin" class="dropdown-item admin-link">Panel Admin</a>
                }
                <hr class="dropdown-divider">
                <button (click)="logout()" class="dropdown-item logout-btn">Cerrar Sesión</button>
            </div>
            }
        </div>
        }@else{
            @if (isLogin()) {
                <button routerLink="/auth/register" class="auth-btn">
                    Registrar
                </button>
            }@else {
                <button routerLink="/auth/login" class="auth-btn">
                    Iniciar Sesion
                </button>
            }
        }
        

    </div>
</header>
