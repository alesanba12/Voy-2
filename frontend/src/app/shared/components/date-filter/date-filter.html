<div class="filter">
  <button class="trigger" [class.is-open]="open()" [attr.aria-expanded]="open()" (click)="toggle()">
    <img class="icon" src="/icons/calendar.svg" alt="" />
    <span>{{ label() }}</span>
    <span class="chev" aria-hidden="true">
      <svg viewBox="0 0 20 20" fill="none">
        <path d="m5.5 7.5 4.5 4.5 4.5-4.5" />
      </svg>
    </span>
  </button>

  @if (open()) {
    <div class="menu">
      <p class="section-title">Filtrar por fecha</p>

      @for (p of presets; track p.id) {
        <button class="option" [class.active]="draft().id === p.id" (click)="selectPreset(p.id)">
          <img class="icon" [src]="'/icons/' + p.icon + '.svg'" alt="" />
          <span>{{ p.label }}</span>
          <img class="check" src="/icons/check.svg" alt="" />
        </button>
      }

      <hr />

      <p class="section-title">Rango personalizado</p>
      <div class="range">
        <label>
          Desde
          <input
            type="date"
            #from
            [value]="draft().from"
            (change)="onManualChange(from.value, to.value)"
          />
        </label>
        <label>
          Hasta
          <input
            type="date"
            #to
            [value]="draft().to"
            (change)="onManualChange(from.value, to.value)"
          />
        </label>
      </div>

      <div class="actions">
        <button class="btn ghost" (click)="close()">Cancelar</button>
        <button class="btn primary" (click)="apply()">Aplicar fecha</button>
      </div>
    </div>
  }
</div>
