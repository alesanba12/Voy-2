<div class="modal-container">
  <h2>Actualizar Perfil</h2>

  <form (ngSubmit)="onSubmit()" class="profile-form">

    <!-- Campo Username con Signal -->
    <div class="form-group">
      <label for="username">Usuario</label>
      <input
        type="text"
        id="username"
        [value]="username()"
        (input)="username.set($any($event.target).value)"
        required
        placeholder="Tu nombre de usuario" />
    </div>

    <!-- Campo Bio con Signal -->
    <div class="form-group">
      <label for="bio">Biografía</label>
      <input
        type="text"
        id="bio"
        [value]="bio()"
        (input)="bio.set($any($event.target).value)"
        maxlength="150"
        placeholder="Contanos algo sobre vos (máx 150 caracteres)" />
    </div>

    <!-- Campo Password con Signal -->
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        [value]="password()"
        (input)="password.set($any($event.target).value)"
        required
        placeholder="••••••••" />
    </div>

    <!-- Componente reutilizable de subida de imagen -->
    <div class="form-group">
      <label>Foto de perfil</label>
      <app-image-upload
        fieldName="image"
        (fileChanged)="onFilePicked($event)" />
    </div>

    <div class="modal-actions">
      <button type="submit" class="btn-submit" >
        Guardar cambios
      </button>
    </div>

  </form>
</div>
