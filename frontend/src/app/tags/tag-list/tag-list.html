<div class="tag-chips-list">
  @for (tag of visibleTags(); track $index) {
    <button
      type="button"
      class="tag-chip-btn"
      [class.selected]="isSelected(tag.name)"
      (click)="toggleTag(tag.name)"
    >
      {{ tag.name }}
    </button>
  } @empty {
    <span class="tags-empty">No hay etiquetas que coincidan</span>
  }
</div>
