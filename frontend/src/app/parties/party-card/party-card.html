@let party = this.party();

<article class="card">
  <div class="card-image">
    <img
      [src]="party.imageUrl || 'Show.webp'"
      [alt]="party.title"
      (error)="onImgError($event)"
    />

    @if (party.tags.length) {
      <span class="tag">{{ party.tags[0] }}</span>
    }
    <div class="card-body">
      <h3>{{ party.title }}</h3>
      <p>{{ party.dateTime | eventDate }}</p>
    </div>
  </div>
</article>
